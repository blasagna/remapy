[workspace]
authors = ["Bob DiMaiolo <bdimaiolo@gmail.com>"]
channels = ["conda-forge"]
name = "remapy"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]
list-devices = "python -m list_devices.main"
capture = "python -m video_capture.main"
capture-headless = "python -m video_capture.main --no-window --max-frames 30"
pose = "python -m pose_estimation.main"
pose-headless = "python -m pose_estimation.main --no-window --max-frames 30"
rerun = "python -m rerun_viewer.main"
rerun-headless = "python -m rerun_viewer.main --no-spawn --save recording.rrd --max-frames 30"
record = "python -m recording.main --output recording.hdf5"
record-headless = "python -m recording.main --output recording.hdf5 --max-frames 30"
export-video = "python -m recording.export"
export-rrd = "python -m rerun_viewer.replay"
replay = "python -m rerun_viewer.replay"
annotate = "python -m annotate.main"
metrics = "python -m motor_metrics.main"
notebook = "jupyter lab notebooks/"
test = "python -m unittest discover -s tests -t . -v"
test-quiet = "python -m unittest discover -s tests -t ."

[dependencies]
python = ">=3.14.6,<3.15"
numpy = ">=2.5.1,<3"
scipy = ">=1.18.0,<2"
pandas = ">=3.0.3,<4"
jupyter = ">=1.1.1,<2"
h5py = ">=3.16.0,<4"
opencv = ">=5.0.0,<6"
pyserial = ">=3.5,<4"
bleak = ">=3.0.2,<4"
matplotlib = ">=3.11.0,<4"

[pypi-dependencies]
mediapipe = ">=0.10.35, <0.11"
rerun-sdk = ">=0.20"
adafruit-nrfutil = ">=0.5.3.post16, <0.6"
circup = ">=3.0.4, <4"
cobs = ">=1.2.2, <2"
