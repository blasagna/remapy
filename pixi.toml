[workspace]
authors = ["Bob DiMaiolo <bdimaiolo@gmail.com>"]
channels = ["conda-forge"]
name = "remapy"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]
capture = "python -m video_capture.main"
capture-headless = "python -m video_capture.main --no-window --max-frames 30"

[dependencies]
python = ">=3.14.6,<3.15"
numpy = ">=2.5.1,<3"
scipy = ">=1.18.0,<2"
pandas = ">=3.0.3,<4"
jupyter = ">=1.1.1,<2"
h5py = ">=3.16.0,<4"
opencv = ">=5.0.0,<6"

[pypi-dependencies]
mediapipe = ">=0.10.35, <0.11"
rerun = ">=1.0.31, <2"
