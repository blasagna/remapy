# The Android build needs considerably more heap than the `:metrics` module does — D8's dex
# merging over the CameraX + Compose + MediaPipe dependency graph will thrash the GC and kill the
# daemon at Gradle's 512 MB default.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g

org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
